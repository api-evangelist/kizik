gap_note: >-
  No standard rate-limit header family is returned on a successful request, so an agent has no runtime
  signal of how close it is to the limit and can only discover it by being throttled. Adding
  RateLimit-Limit / RateLimit-Remaining / RateLimit-Reset (RFC 9238 draft family) or a Retry-After on the
  429 would make this surface self-describing.
