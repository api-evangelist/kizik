generated: '2026-08-23'
method: probed
source: https://kizik.com/.well-known/ucp + https://kizik.com/.well-known/openid-configuration + https://kizik.com/api/ucp/mcp
standards:
- id: ucp
  name: Universal Commerce Protocol
  conforms: true
  version: '2026-04-08'
  evidence: >-
    /.well-known/ucp returns HTTP 200 with a ucp.version of 2026-04-08, supported_versions for
    2026-04-08 and 2026-01-23, a dev.ucp.shopping service over the mcp transport, and seven declared
    dev.ucp.shopping.* capabilities (checkout, cart, fulfillment, discount, order, catalog.search,
    catalog.lookup).
  spec: https://ucp.dev/2026-04-08/specification/overview/
- id: mcp
  name: Model Context Protocol
  conforms: true
  evidence: >-
    POST https://kizik.com/api/ucp/mcp with method tools/list returned a JSON-RPC 2.0 result containing
    13 tools, each with a JSON Schema 2020-12 inputSchema. Response carried
    x-shopify-ucp-mcp-api-version: 2026-04-08.
- id: jsonrpc-2.0
  name: JSON-RPC 2.0
  conforms: true
  evidence: All MCP requests and responses carry "jsonrpc":"2.0"; errors use the JSON-RPC error object.
- id: json-schema-2020-12
  name: JSON Schema 2020-12
  conforms: true
  evidence: >-
    Every tool inputSchema declares
    "$schema":"https://json-schema.org/draft/2020-12/schema".
- id: oidc
  name: OpenID Connect Discovery 1.0
  conforms: true
  evidence: >-
    /.well-known/openid-configuration returns HTTP 200 with issuer, authorization_endpoint,
    token_endpoint, jwks_uri, response_types_supported and id_token_signing_alg_values_supported.
- id: oauth2
  name: OAuth 2.0
  conforms: true
  evidence: authorization_code + refresh_token + jwt-bearer grant types declared in discovery.
- id: rfc8414
  name: OAuth 2.0 Authorization Server Metadata (RFC 8414)
  conforms: true
  evidence: /.well-known/oauth-authorization-server returns HTTP 200 with authorization server metadata.
- id: rfc7636
  name: PKCE (RFC 7636)
  conforms: true
  evidence: code_challenge_methods_supported includes S256.
- id: rfc8615
  name: Well-Known URIs (RFC 8615)
  conforms: true
  evidence: Three documents served under /.well-known/ on kizik.com.
- id: iso4217
  name: ISO 4217 currency minor units
  conforms: true
  evidence: >-
    Every MCP price field is documented as an integer in ISO 4217 minor units paired with a currency
    code, e.g. {"amount": 600, "currency": "USD"}.
- id: llms-txt
  name: llms.txt
  conforms: true
  evidence: https://kizik.com/llms.txt returns HTTP 200 with a real agent instruction document.
- id: rfc9116
  name: security.txt (RFC 9116)
