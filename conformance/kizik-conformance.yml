- id: a2a
  name: A2A Agent Card
  conforms: false
  evidence: /.well-known/agent-card.json and /.well-known/agent.json both returned HTTP 404 on kizik.com and kizik-design.myshopify.com.
- id: openapi
  name: OpenAPI
  conforms: false
  evidence: No OpenAPI, Swagger, GraphQL SDL, gRPC/Protobuf or WSDL contract found on any Kizik host.
domain_standard:
  id: ucp
  name: Universal Commerce Protocol (dev.ucp.shopping.*)
  market: retail / e-commerce / agentic commerce
  declared_in_contract: true
  evidence: >-
    The contract declares the domain standard about itself rather than in marketing prose: the
    /.well-known/ucp merchant profile enumerates dev.ucp.shopping.checkout, dev.ucp.shopping.cart,
    dev.ucp.shopping.fulfillment, dev.ucp.shopping.discount, dev.ucp.shopping.order,
    dev.ucp.shopping.catalog.search and dev.ucp.shopping.catalog.lookup, each bound to a versioned
    ucp.dev schema URL, plus the dev.shopify.catalog extension. An agent that already speaks UCP can
    transact with Kizik with no bespoke connector.
  spec: https://ucp.dev
certifications: []
compliance_note: >-
  Kizik publishes no trust center, no SOC 2 / ISO 27001 / PCI attestation page and no named
  certifications on any public page probed, so no Compliance pointer is emitted. Card data is handled by
  Shopify Payments and the declared payment handlers, not by Kizik directly.
