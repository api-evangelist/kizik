aid: kizik
name: Kizik
description: 'Kizik is the hands-free footwear company founded in Alpine, Utah, built on the patented
  Cage and Inner Cage step-in technology that lets a wearer put on a shoe without bending down, tying,
  or using their hands. Kizik sells direct-to-consumer at kizik.com across men''s, women''s and kids''
  lines, and licenses its hands-free technology to other footwear brands. Kizik has no traditional
  developer program, but it operates a real, publicly reachable agent commerce surface: its Shopify
  storefront serves an agent instruction document at /agents.md and /llms.txt, a Universal Commerce
  Protocol (UCP) merchant profile at /.well-known/ucp, and an unauthenticated MCP endpoint at
  /api/ucp/mcp exposing thirteen catalog, cart, checkout and order tools with full JSON Schema inputs.
  Customer identity is OpenID Connect, discoverable at /.well-known/openid-configuration.'
