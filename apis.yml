apis:
- name: Kizik Agent Commerce API (UCP / MCP)
  description: 'Kizik''s Universal Commerce Protocol surface, exposed over MCP at
    https://kizik.com/api/ucp/mcp. An unauthenticated tools/list returns thirteen tools covering catalog
    search and lookup, cart create/update/cancel, checkout create/update/complete/cancel, and order
    retrieval, each with a full JSON Schema 2020-12 inputSchema. Payment completion requires
    contemporaneous human approval; agents must not finalize checkout autonomously.'
