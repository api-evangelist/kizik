generated: '2026-08-23'
method: probed
source: https://kizik.com/api/ucp/mcp
name: Kizik UCP Commerce MCP Server
description: >-
  Kizik's Universal Commerce Protocol (UCP) shopping service, exposed over MCP on Kizik's own domain.
  An unauthenticated JSON-RPC tools/list returns 13 tools with full JSON Schema 2020-12 inputSchemas
  covering catalog search/lookup, cart lifecycle, checkout lifecycle, and order retrieval.
status: live
ownership:
  note: >-
    The protocol implementation is Shopify platform infrastructure, but this is Kizik's own per-merchant
    instance and it says so about itself: the UCP discovery document names merchant_name "Kizik",
    merchant_origin "kizik.com", Shopify shop_id 22811461 and tenant kizik-design.myshopify.com, and the
    endpoint is served from kizik.com. Kizik's own robots.txt and /agents.md direct agents to it. The
    tools transact Kizik's catalog and Kizik's checkout, so the surface belongs to Kizik.
  merchant_name: Kizik
  merchant_origin: kizik.com
  shop_id: '22811461'
  tenant: kizik-design.myshopify.com
deployment:
  mode: remote
  endpoint: https://kizik.com/api/ucp/mcp
  auth: none
  verified: probed
  note: >-
    tools/list answered HTTP 200 anonymously on 2026-08-23 with no OAuth challenge. Individual tools/call
    invocations additionally require a meta.ucp-agent.profile URI (an agent profile URL the caller
    publishes); without it the server returns JSON-RPC error -32001 invalid_profile_url.
transport: http-json-rpc
protocol:
  ucp_version: '2026-04-08'
  ucp_supported_versions:
  - '2026-04-08'
  - '2026-01-23'
  mcp_api_version_header: x-shopify-ucp-mcp-api-version
  discovery: https://kizik.com/.well-known/ucp
  spec: https://ucp.dev/2026-04-08/specification/overview/
  schema: https://ucp.dev/2026-04-08/services/shopping/mcp.openrpc.json
tool_count: 13
tools:
- name: search_catalog
  category: catalog
  description: Search for products from the online store, hosted on Shopify.
  required: [meta, catalog]
- name: lookup_catalog
  category: catalog
  description: Look up multiple products or variants by identifier.
  required: [meta, catalog]
- name: get_product
  category: catalog
  description: Retrieve complete product detail by identifier. Returns a singular product.
  required: [meta, catalog]
- name: create_cart
  category: cart
  description: Creates a new cart.
  required: [meta, cart]
- name: get_cart
  category: cart
  description: Get the cart contents.
  required: [meta, id]
- name: update_cart
  category: cart
  description: Perform updates to a cart.
  required: [meta, cart, id]
- name: cancel_cart
  category: cart
  description: Cancels a cart.
  required: [meta, id]
- name: create_checkout
  category: checkout
  description: Creates a checkout. Returns checkout details, including line items, totals, discounts and taxes.
  required: [meta, checkout]
- name: get_checkout
  category: checkout
  description: Returns details about the checkout, including line items, totals, discounts and taxes.
  required: [meta, id]
- name: update_checkout
  category: checkout
  description: Updates a checkout. Returns checkout details.
  required: [meta, checkout, id]
- name: complete_checkout
  category: checkout
  description: Completes a checkout. Returns order ID, Thank You Page URL, or errors. Requires buyer approval.
  required: [meta, id, checkout]
- name: cancel_checkout
  category: checkout
  description: Cancels a checkout.
  required: [meta, id]
- name: get_order
  category: order
  description: Get the details of an order.
  required: [meta, id]
capabilities:
- dev.ucp.shopping.catalog.search
- dev.ucp.shopping.catalog.lookup
- dev.ucp.shopping.cart
- dev.ucp.shopping.checkout
- dev.ucp.shopping.fulfillment
- dev.ucp.shopping.discount
- dev.ucp.shopping.order
- dev.shopify.catalog
payment_handlers:
- id: gpay
  handler: com.google.pay
  version: '2026-01-11'
  merchant_name: Kizik
  networks: [VISA, MASTERCARD, AMEX, DISCOVER]
- id: shopify.card
  handler: dev.shopify.card
  version: '2026-01-15'
  networks: [visa, master, american_express, discover, diners_club]
- id: shop_pay
  handler: dev.shopify.shop_pay
  version: '2026-04-08'
human_approval_required: true
human_approval_note: >-
  Both robots.txt and /agents.md state that checkout, payment and order placement must not be completed
  automatically. Agents must obtain explicit, contemporaneous buyer approval at the moment of payment, or
  route the purchase through the Shopify Shop skill at https://shop.app/SKILL.md.
raw_tools_list: kizik-mcp-tools-list.json
